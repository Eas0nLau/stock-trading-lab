version: '3.8'

services:
  mysql_new:
    image: mysql:8.0
    container_name: mysql_v8.0
    restart: always # 自动启动
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: stock_trading_lab
      # 设置默认认证插件为 caching_sha2_password
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: caching_sha2_password
    ports:
      - "3306:3306"
    volumes:
#      - G:\docker\mysql\data:/var/lib/mysql
      - mysql-data:/var/lib/mysql
      # Optional clean initialization. Uncomment only for a new empty volume.
      # - ../../stock_trading_lab_v2.sql:/docker-entrypoint-initdb.d/001-stock-trading-lab.sql:ro
    networks:
      - mysql_network
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=8G
      - --innodb-buffer-pool-instances=4
      - --innodb-log-file-size=1G
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-io-capacity=1000
      - --innodb-io-capacity-max=4000
      - --innodb-read-io-threads=8
      - --innodb-write-io-threads=8
      - --max-connections=100
      - --table_open_cache=3000
      - --sort_buffer_size=4M
      - --read_buffer_size=1M
      - --read_rnd_buffer_size=2M
      - --tmp_table_size=128M
      - --max_heap_table_size=128M
